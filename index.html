<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生曲线 · Life Picture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ══ DESIGN TOKENS ══════════════════════════════════════════════════════ */
    :root {
      --bg:        #f4efe7;
      --surface:   #ffffff;
      --surface2:  #faf7f2;
      --border:    #ddd5c8;
      --border2:   #e8e0d4;
      --text:      #1a1714;
      --text2:     #6b6057;
      --text3:     #9e9088;
      --accent:    #b08040;
      --accent2:   #8c6428;
      --accent-bg: #f5eddc;

      /* Chart dark theme */
      --chart-bg:  #080b12;
      --chart-bg2: #0d1520;
      --chart-bd:  #162840;

      /* Curve colors */
      --c-employ:    #4a8fa8;
      --c-pulse:     #c9614a;
      --c-serial:    #5a8f6a;
      --c-ai:        #8b62c4;
      --c-capital:   #b08040;
      --c-composite: #d4c8b8;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ui:      'DM Sans', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', monospace;

      --radius:    6px;
      --radius-lg: 12px;
      --shadow:    0 1px 4px rgba(26,23,20,0.08), 0 4px 16px rgba(26,23,20,0.04);
      --shadow-lg: 0 2px 8px rgba(26,23,20,0.10), 0 8px 32px rgba(26,23,20,0.06);
    }

    /* ══ RESET ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ══ SCROLLBAR ══════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ══ NAV ════════════════════════════════════════════════════════════════ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      height: 56px;
      gap: 0;
    }

    .nav-brand {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-right: 40px;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-brand span {
      color: var(--accent);
    }

    .nav-tabs {
      display: flex;
      gap: 0;
      flex: 1;
    }

    .nav-tab {
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 18px;
      height: 56px;
      position: relative;
      transition: color 0.2s;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .nav-tab:hover { color: var(--text); }

    .nav-tab.active {
      color: var(--accent);
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18px;
      right: 18px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    .nav-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-age-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
    }

    /* ══ PAGES ══════════════════════════════════════════════════════════════ */
    .page { display: none; }
    .page.active { display: block; }

    /* ══ PAGE: TODAY ════════════════════════════════════════════════════════ */
    .today-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 40px;
      align-items: center;
      padding: 40px 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 100%;
      background: linear-gradient(135deg, transparent, var(--accent-bg));
      pointer-events: none;
      opacity: 0.5;
    }

    .hero-age {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 300;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .hero-age-label {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 400;
      color: var(--text3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-date {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 400;
      color: var(--text);
      font-style: italic;
    }

    .hero-stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      width: fit-content;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero-stage-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .hero-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 200px;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctrl-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ══ FORM ELEMENTS ══════════════════════════════════════════════════════ */
    input[type="range"] {
      width: 100%;
      height: 4px;
      appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 2px var(--accent);
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    select, input[type="text"], textarea {
      width: 100%;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 8px 16px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent2); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface2);
      border-color: var(--text3);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid transparent;
    }

    .btn-ghost:hover {
      background: var(--surface2);
      border-color: var(--border);
    }

    .btn-sm { font-size: 12px; padding: 5px 11px; }
    .btn-xs { font-size: 11px; padding: 3px 8px; }

    /* ══ SECTION LAYOUT ═════════════════════════════════════════════════════ */
    .section-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.01em;
      margin-bottom: 16px;
    }

    .section-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: var(--text3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* ══ CURVE STATUS CARDS ════════════════════════════════════════════════ */
    .curve-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .curve-card {
      display: grid;
      grid-template-columns: 120px 1fr 48px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      transition: border-color 0.2s;
    }

    .curve-card:hover { border-color: var(--border); }

    .curve-card-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .curve-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .curve-bar-wrap {
      height: 4px;
      background: var(--border2);
      border-radius: 2px;
      overflow: hidden;
    }

    .curve-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .curve-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      text-align: right;
    }

    /* ══ MILESTONES SIDEBAR ════════════════════════════════════════════════ */
    .milestone-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .milestone-item {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border2);
      position: relative;
    }

    .milestone-item:last-child { border-bottom: none; }

    .milestone-age {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      border-radius: 4px;
      padding: 2px 7px;
      height: fit-content;
      margin-top: 1px;
      white-space: nowrap;
    }

    .milestone-text {
      font-size: 13px;
      color: var(--text);
      flex: 1;
      line-height: 1.5;
    }

    .milestone-done .milestone-text {
      text-decoration: line-through;
      color: var(--text3);
    }

    .milestone-check {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .milestone-check:hover { border-color: var(--accent); }
    .milestone-check.checked { background: var(--accent); border-color: var(--accent); }

    .milestone-check.checked::after {
      content: '';
      display: block;
      width: 8px;
      height: 5px;
      border-left: 1.5px solid #fff;
      border-bottom: 1.5px solid #fff;
      transform: rotate(-45deg) translate(0px, -1px);
    }

    /* Bull market */
    .bull-card {
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bull-icon {
      font-size: 22px;
      line-height: 1;
    }

    .bull-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text3);
    }

    .bull-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .bull-status.up { color: #4a8; }
    .bull-status.down { color: #c64; }

    /* Notes */
    .notes-section {
      margin-top: 24px;
    }

    /* ══ PAGE: CURVES ═══════════════════════════════════════════════════════ */
    #page-curves {
      display: none;
      flex-direction: column;
      height: calc(100vh - 56px);
    }

    #page-curves.active {
      display: flex;
    }

    .curves-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .view-btn {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      color: var(--text3);
      transition: all 0.15s;
    }

    .view-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .view-btn:not(.active):hover {
      background: var(--surface2);
      color: var(--text);
    }

    .curve-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: center;
    }

    .curve-pill {
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 500;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      background: transparent;
      color: var(--text3);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .curve-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .curve-pill.active {
      color: var(--text);
      background: var(--surface2);
    }

    .curves-body {
      flex: 1;
      position: relative;
      background: var(--chart-bg);
      overflow: hidden;
    }

    .chart-canvas-wrap {
      position: absolute;
      inset: 0;
      padding: 16px 16px 16px 0;
    }

    #lifeChart {
      width: 100% !important;
      height: 100% !important;
    }

    /* Strength Panel */
    .strength-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 172px;
      background: rgba(8, 11, 18, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      padding: 16px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .sp-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .sp-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .sp-row:last-child { margin-bottom: 0; }

    .sp-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sp-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sp-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .sp-val {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
    }

    .sp-slider {
      width: 100%;
      height: 3px;
      appearance: none;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .sp-slider::-webkit-slider-thumb {
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      border: none;
      transition: transform 0.15s;
    }

    .sp-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

    /* Age slider in curves toolbar */
    .curves-age-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .curves-age-lbl {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
      white-space: nowrap;
    }

    /* ══ PAGE: LOG ══════════════════════════════════════════════════════════ */
    .log-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* Journal */
    .journal-add {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .journal-entries {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 500px;
      overflow-y: auto;
    }

    .journal-entry {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.2s;
    }

    .journal-entry:hover { border-color: var(--border); }

    .journal-entry-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .journal-date {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
    }

    .journal-age-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-bg);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .journal-text {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.65;
    }

    .journal-del {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .journal-del:hover { background: #fee; color: #c44; }

    /* Milestone Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 16px;
      bottom: 16px;
      width: 1px;
      background: var(--border);
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      position: relative;
    }

    .timeline-dot-wrap {
      width: 48px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      transition: all 0.2s;
    }

    .timeline-item.done .timeline-dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    .timeline-age {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      margin-top: -2px;
    }

    .timeline-content {
      flex: 1;
      padding-bottom: 8px;
    }

    .timeline-text {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.5;

function deepMerge(target, source) {
  const out = { ...target };
  for (const k of Object.keys(source)) {
    if (source[k] !== null && typeof source[k] === 'object' && !Array.isArray(source[k])) {
      out[k] = deepMerge(target[k] || {}, source[k]);
    } else {
      out[k] = source[k];
    }
  }
  return out;
}

/* ══ CURVE MATH ═════════════════════════════════════════════════════════════ */
function smoothstep(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

function calcEmploy(p, ages) {
  // 传统就业：上班族曲线。入职后线性升至巅峰（约35岁），再线性降至退休归零。
  // 退休后硬归零——就业是"低保"不是遗产，资本才托底。
  const peak = 72 * (p.str / 100);
  return ages.map(age => {
    if (age < p.startAge) return 0;
    if (age <= p.peakAge) {
      const t = (age - p.startAge) / (p.peakAge - p.startAge || 1);
      return peak * t; // 线性上升
    }
    if (age <= p.retireAge) {
      const t = (age - p.peakAge) / (p.retireAge - p.peakAge || 1);
      return peak * (1 - t); // 线性下降
    }
    return 0; // 退休后归零
  });
}

function calcPulse(p, ages) {
  // 创业脉冲：ECG心跳模式。
  // 失败尝试：快速冲上去快速跌落，小幅度(8-15)，窄脉宽(0.2-0.4yr)
  // 成功尝试：快速冲上去，缓慢回落，大幅度(50-80)，宽脉宽(1-2yr)
  // 上升沿陡（0.15yr），下降沿根据成败决定宽度——不对称Gaussian
  const pulses = [];
  const span = Math.min(35, 75 - p.startAge);
  const avgGap = span / Math.max(p.cnt, 1);
  let t = p.startAge + avgGap * 0.3;
  // 用固定种子确保同参数下图形稳定
  const seed = p.startAge * 7 + p.cnt * 13;
  const rand = (i, salt) => Math.abs(Math.sin(seed + i * 17.3 + salt * 5.7));
  for (let i = 0; i < p.cnt; i++) {
    const gap = avgGap * (0.6 + 0.8 * rand(i, 1));
    t += gap;
    if (t > 78) break;
    const ok = rand(i, 2) < (p.rate / 100);
    const amp = ok
      ? (50 + 30 * rand(i, 3)) * (p.str / 100)   // 成功：大幅
      : (8  + 10 * rand(i, 4)) * (p.str / 100);   // 失败：小幅
    const riseW = 0.15;                             // 上升沿都很陡
    const fallW = ok ? 1.2 + 0.8 * rand(i, 5) : 0.25 + 0.15 * rand(i, 5); // 成功缓落，失败速落
    pulses.push({ c: t, amp, riseW, fallW });
  }
  return ages.map(age => {
    let v = 0;
    for (const px of pulses) {
      const dt = age - px.c;
      let contrib = 0;
      if (dt < 0) {
        // 上升沿（提前）
        const d = -dt / px.riseW;
        contrib = px.amp * Math.exp(-2 * d * d);
      } else {
        // 下降沿（延后）
        const d = dt / px.fallW;
        contrib = px.amp * Math.exp(-1.5 * d * d);
      }
      v = Math.max(v, contrib);
    }
    return v;
  });
}

function calcSerial(p, ages) {
  // 连续创业：严格7年周期，每轮新底板 > 上一轮底板（"越签越高"）
  // 每轮：前2年探索（从底板缓慢爬升）→ 中间高速增长 → 末期短暂回落到新底板
  // 新底板 = 上一轮峰值的30-45%，严格递增
  const MAX = 90 * (p.str / 100);
  const steps = [];
  let floor = 2, t = p.startAge; // 从极低点起步
  for (let i = 0; i < p.cyc; i++) {
    const prog = (i + 1) / p.cyc;
    const peak = MAX * (0.25 + 0.75 * Math.pow(prog, 0.7)); // 每轮峰值递增
    const explore = p.len * 0.28;   // 探索期
    const earn    = p.len * 0.52;   // 收益期
    // 新底板：严格高于当前底板，取峰值35%和(floor+8)的较大值
    const newFloor = Math.max(floor + 5, peak * 0.35);
    steps.push({ t0: t, t1: t + explore, t2: t + explore + earn, t3: t + p.len, floor, peak, newFloor });
    floor = newFloor;
    t += p.len;
  }
  if (steps.length === 0) return ages.map(() => 0);
  const last = steps[steps.length - 1];
  return ages.map(age => {
    if (age < steps[0].t0) return 0;
    if (age >= last.t3) return last.newFloor; // 最终稳定在高底板
    for (const s of steps) {
      if (age >= s.t0 && age < s.t3) {
        if (age <= s.t1) {
          // 探索期：从底板缓慢爬升
          const t2 = (age - s.t0) / (s.t1 - s.t0 || 1);
          return s.floor + (s.peak * 0.55 - s.floor) * smoothstep(t2);
        } else if (age <= s.t2) {
          // 收益期：高速攀升至峰值，小幅震荡
          const t2 = (age - s.t1) / (s.t2 - s.t1 || 1);
          const base = s.peak * 0.55 + (s.peak - s.peak * 0.55) * smoothstep(t2);
          return base + Math.sin((age - s.t1) * 3.5) * s.peak * 0.018;
        } else {
          // 过渡期：从峰值回落至新底板
          const t2 = (age - s.t2) / (s.t3 - s.t2 || 1);
          return s.peak + (s.newFloor - s.peak) * smoothstep(t2);
        }
      }
    }
    return 0;
  });
}

function calcAI(p, ages) {
  // AI协作：采用后近乎垂直跃升（0.4年内到达初始高度），然后线性持续增长
  // 跃升幅度由jump参数决定，增长斜率由depth（协作深度）决定
  const jumpHeight = (p.jump / 100) * 55; // 初始跃迁高度（最高55分）
  const growthRate = (p.depth / 100) * 2.8; // 年增长速率（满深度≈2.8/年）
  return ages.map(age => {
    if (age < p.startAge) return 0;
    const t = age - p.startAge;
    // 近垂直跃升：用极陡sigmoid，0.4年内完成80%跃升
    const jumpFrac = 1 / (1 + Math.exp(-12 * (t - 0.2)));
    const jumpVal = jumpHeight * jumpFrac;
    // 跃升后线性增长
    const growthVal = growthRate * Math.max(0, t - 0.4);
    return Math.min(98, jumpVal + growthVal);
  });
}

function calcCapital(p, ages) {
  // 资本复利：经典复利曲线（hockey stick）
  // 退休前（65岁）指数增长；65岁后切换为保守管理，曲线走平（不再增长也不下降）
  // 归一化：让30年复利后的值接近90分
  const r = p.rate / 100;
  const RETIRE_AGE = 65;
  // 计算缩放因子：让满参数下退休时约达85分
  const K0 = p.init * 0.12;
  const C  = p.add  * 0.04;
  const computeRaw = (t) => {
    const kg = K0 * Math.pow(1 + r, t);
    const cg = r > 0 ? C * (Math.pow(1 + r, t) - 1) / r : C * t;
    return kg + cg;
  };
  // 退休年时的资产值（用作走平基准）
  const retireT = Math.max(0, RETIRE_AGE - p.startAge);
  const retireVal = Math.min(95, computeRaw(retireT));
  return ages.map(age => {
    if (age < p.startAge) return 0;
    const t = age - p.startAge;
    if (age >= RETIRE_AGE) {
      return retireVal; // 走平——保守管理，维持不减
    }
    return Math.min(95, computeRaw(t));
  });
}

function calcAllCurves() {
  const p = S.params;
  const data = {
    employ:  calcEmploy(p.employ, AGES),
    pulse:   calcPulse(p.pulse, AGES),
    serial:  calcSerial(p.serial, AGES),
    ai:      calcAI(p.ai, AGES),
    capital: calcCapital(p.capital, AGES),
  };
  data.composite = calcComposite(data, S.enabled);
  return data;
}

function calcComposite(data, enabled) {
  // 复合叠加：资本曲线承担"托底"职能，权重最高
  // 核心逻辑：composite的每个低点 > 前一个低点（永久牛市）
  // 资本的走平特性 + 连续创业的底板递升 = 低点永远不会低于历史低点
  const W = { employ: 0.10, pulse: 0.15, serial: 0.28, ai: 0.22, capital: 0.25 };
  const raw = AGES.map((_, i) => {
    let sum = 0, wsum = 0;
    for (const k of Object.keys(W)) {
      if (enabled[k] && data[k]) { sum += (data[k][i] || 0) * W[k]; wsum += W[k]; }
    }
    return wsum > 0 ? sum / wsum : 0;
  });
  // 轻度平滑（保留形态，去除噪声）
  return raw.map((v, i) => {
    if (i === 0 || i === raw.length - 1) return v;
    return raw[i-1] * 0.2 + v * 0.6 + raw[i+1] * 0.2;
  });
}

function getAgeIndex(age) {
  const idx = Math.round(age) - MIN_AGE;
  return Math.max(0, Math.min(AGES.length - 1, idx));
}

function getCurveValueAt(curveData, age) {
  const idx = getAgeIndex(age);
  return curveData[idx] || 0;
}

/* ══ BULL MARKET CHECK ══════════════════════════════════════════════════════ */
function checkBullMarket() {
  const data = calcAllCurves();
  const comp = data.composite;
  const startIdx = getAgeIndex(S.currentAge);

  // Find local minima after current age
  const minima = [];
  for (let i = startIdx + 1; i < comp.length - 1; i++) {
    if (comp[i] < comp[i-1] && comp[i] < comp[i+1]) {
      minima.push({ idx: i, val: comp[i] });
    }
  }

  if (minima.length < 2) return { bull: true, reason: '趋势整体向上' };

  let prevMin = minima[0].val;
  for (let i = 1; i < minima.length; i++) {
    if (minima[i].val <= prevMin) return { bull: false, reason: '存在下行风险' };
    prevMin = minima[i].val;
  }
  return { bull: true, reason: '每次低谷均高于前次' };
}

/* ══ NOW LINE PLUGIN ════════════════════════════════════════════════════════ */
const nowLinePlugin = {
  id: 'nowLine',
  afterDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const xScale = scales.x;
    const age = S.currentAge;
    if (age < xScale.min || age > xScale.max) return;
    const x = xScale.getPixelForValue(age);
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = 'rgba(255, 107, 53, 0.65)';
    ctx.lineWidth = 1.5;
    ctx.moveTo(x, chartArea.top);
    ctx.lineTo(x, chartArea.bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 107, 53, 0.85)';
    ctx.font = '500 10px JetBrains Mono, monospace';
    ctx.fillText('NOW', x + 5, chartArea.top + 15);
    ctx.restore();
  }
};

function refreshChartData() {
  if (!chart) return;
  const data = calcAllCurves();
  const keyOrder = ['composite', 'employ', 'pulse', 'serial', 'ai', 'capital'];
  const dataMap = { composite: data.composite, employ: data.employ, pulse: data.pulse, serial: data.serial, ai: data.ai, capital: data.capital };
  chart.data.datasets.forEach((ds, i) => {
    const key = keyOrder[i];
    ds.data = dataMap[key];
    ds.hidden = !S.enabled[key];
  });
  chart.update('none');
}

    p.classList.remove('active');

  currentPage = name;
}

function updateTodayPage() {
  const age = S.currentAge;
  // Date
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('hero-date').textContent = dateStr;

  // Stage
  const stage = STAGES[S.stage] || STAGES.explore;

  // Compute all curves at current age
  const data = calcAllCurves();
  const vals = {};
  CURVE_DEFS.forEach(cd => {
    vals[cd.key] = getCurveValueAt(data[cd.key], age);
  });

  // Composite stat
  document.getElementById('stat-composite').textContent = vals.composite.toFixed(1);

  // Bull market
  const bull = checkBullMarket();
  document.getElementById('stat-bull').textContent = bull.bull ? '🐂 牛市' : '🐻 熊市';
  document.getElementById('bull-icon').textContent = bull.bull ? '📈' : '📉';
  const bullEl = document.getElementById('bull-status-text');
  bullEl.textContent = bull.reason;
  bullEl.className = 'bull-status ' + (bull.bull ? 'up' : 'down');

  // Curve cards
  const cc = document.getElementById('curve-cards');
  cc.innerHTML = '';
  CURVE_DEFS.forEach(cd => {
    const v = vals[cd.key];
    const pct = Math.min(100, v).toFixed(0);
    const div = document.createElement('div');
    div.className = 'curve-card';
    div.innerHTML = `
      <div class="curve-card-name">
        <span class="curve-dot" style="background:${cd.color}"></span>
        ${cd.label}
      </div>
      <div class="curve-bar-wrap">
        <div class="curve-bar" style="width:${pct}%;background:${cd.color}44;border-right:2px solid ${cd.color};"></div>
      </div>
      <div class="curve-val" style="color:${cd.color}">${pct}</div>
    `;
    cc.appendChild(div);
  });

  // Upcoming milestones
  const upcoming = S.milestones
    .filter(m => !m.done && m.age >= Math.floor(age))
    .sort((a, b) => a.age - b.age)
    .slice(0, 4);

  const um = document.getElementById('upcoming-milestones');
  if (upcoming.length === 0) {
    um.innerHTML = '<div class="empty">暂无即将到来的里程碑</div>';
  } else {
    um.innerHTML = '';
    upcoming.forEach(m => {
      const d = document.createElement('div');
      d.className = 'milestone-item';
      const diff = m.age - Math.floor(age);
      d.innerHTML = `
        <div class="milestone-age">${m.age}</div>
        <div class="milestone-text">${escHtml(m.text)}
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">还有 ${diff} 年</div>
        </div>
      `;
      um.appendChild(d);
    });
  }

  // Note
  document.getElementById('today-note').value = S.todayNote;
}

  persist();
  toast('笔记已保存', 'success');
}

/* ══ STAGE SELECT ═══════════════════════════════════════════════════════════ */
document.getElementById('stage-select').addEventListener('change', e => {
  S.stage = e.target.value;
  persist();
  updateTodayPage();
});

/* ══ STRENGTH PANEL ═════════════════════════════════════════════════════════ */
function spUpdate(curve, param, val, labelId) {
  S.params[curve][param] = val;
  document.getElementById(labelId).textContent = val;
  persist();
  refreshChartData();
  updateTodayPage();
}

/* ══ CURVE PILLS ════════════════════════════════════════════════════════════ */
function renderPills() {
  const container = document.getElementById('curve-pills');
  container.innerHTML = '';
  CURVE_DEFS.forEach(cd => {
    const btn = document.createElement('button');
    btn.className = 'curve-pill' + (S.enabled[cd.key] ? ' active' : '');
    btn.innerHTML = `<span class="curve-pill-dot" style="background:${cd.color}${S.enabled[cd.key] ? '' : '44'}"></span>${cd.label}`;
    btn.onclick = () => {
      S.enabled[cd.key] = !S.enabled[cd.key];
      persist();
      renderPills();
      refreshChartData();
      updateTodayPage();
    };
    container.appendChild(btn);
  });
}

/* ══ JOURNAL ════════════════════════════════════════════════════════════════ */
function addJournal() {
  const text = document.getElementById('journal-input').value.trim();
  if (!text) { toast('请输入日志内容', 'error'); return; }
  const entry = {
    date: new Date().toISOString(),
    age: parseFloat(S.currentAge.toFixed(1)),
    text,
  };
  S.journal.unshift(entry);
  persist();
  document.getElementById('journal-input').value = '';
  renderJournal();
  toast('日志已添加', 'success');
}

function deleteJournal(idx) {
  S.journal.splice(idx, 1);
  persist();
  renderJournal();
}

function renderJournal() {
  const list = document.getElementById('journal-list');
  if (S.journal.length === 0) {
    list.innerHTML = '<div class="empty">暂无日志记录，开始记录你的旅程</div>';
    return;
  }
  list.innerHTML = '';
  S.journal.forEach((e, i) => {
    const d = new Date(e.date);
    const dateStr = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
    const div = document.createElement('div');
    div.className = 'journal-entry';
    div.innerHTML = `
      <div class="journal-entry-header">
        <span class="journal-date">${dateStr}</span>
        <span class="journal-age-badge">age ${e.age}</span>
        <button class="journal-del" onclick="deleteJournal(${i})">删除</button>
      </div>
      <div class="journal-text">${escHtml(e.text)}</div>
    `;
    list.appendChild(div);
  });
}

/* ══ MILESTONES ═════════════════════════════════════════════════════════════ */
function addMilestone() {
  const age = parseInt(document.getElementById('ms-age-input').value);
  const text = document.getElementById('ms-text-input').value.trim();
  if (isNaN(age) || age < 15 || age > 85) { toast('请输入有效年龄 (15-85)', 'error'); return; }
  if (!text) { toast('请输入里程碑内容', 'error'); return; }
  S.milestones.push({ age, text, done: false, note: '' });
  S.milestones.sort((a, b) => a.age - b.age);
  persist();
  document.getElementById('ms-age-input').value = '';
  document.getElementById('ms-text-input').value = '';
  renderTimeline();
  updateTodayPage();
  toast('里程碑已添加', 'success');
}

function toggleMilestone(idx) {
  S.milestones[idx].done = !S.milestones[idx].done;
  persist();
  renderTimeline();
  updateTodayPage();
}

function deleteMilestone(idx) {
  S.milestones.splice(idx, 1);
  persist();
  renderTimeline();
  updateTodayPage();
}

function renderTimeline() {
  const tl = document.getElementById('milestone-timeline');
  if (S.milestones.length === 0) {
    tl.innerHTML = '<div class="empty">暂无里程碑</div>';
    return;
  }
  tl.innerHTML = '';
  S.milestones.forEach((m, i) => {
    const isPast = m.age < S.currentAge;
    const div = document.createElement('div');
    div.className = 'timeline-item' + (m.done ? ' done' : '') + (isPast ? ' past' : '');
    div.innerHTML = `
      <div class="timeline-dot-wrap">
        <div class="timeline-dot"></div>
        <div class="timeline-age">${m.age}</div>
      </div>
      <div class="timeline-content">
        <div class="timeline-text">${escHtml(m.text)}</div>
        ${m.note ? `<div class="timeline-note">${escHtml(m.note)}</div>` : ''}
        <div class="timeline-actions">
          <button class="btn btn-ghost btn-xs" onclick="toggleMilestone(${i})">${m.done ? '↩ 撤销' : '✓ 完成'}</button>
          <button class="btn btn-ghost btn-xs" style="color:#c64;" onclick="deleteMilestone(${i})">删除</button>
        </div>
      </div>
    `;
    tl.appendChild(div);
  });
}

function renderLog() {
  renderJournal();
  renderTimeline();
}

/* ══ SETTINGS ═══════════════════════════════════════════════════════════════ */
function renderSettings() {
  renderAccordions();
  renderSnapshots();
}

function renderAccordions() {
  const container = document.getElementById('settings-accordions');
  container.innerHTML = '';

  const curveDefs = CURVE_DEFS.filter(cd => cd.key !== 'composite');

  curveDefs.forEach(cd => {
    const meta = PARAM_META[cd.key];
    const params = S.params[cd.key];

    const acc = document.createElement('div');
    acc.className = 'accordion';
    acc.id = `acc-${cd.key}`;

    acc.innerHTML = `
      <div class="accordion-head" onclick="toggleAcc('${cd.key}')">
        <span class="accordion-color" style="background:${cd.color}"></span>
        <span class="accordion-name">${cd.label}</span>
        <span style="font-size:11px;font-family:var(--font-mono);color:var(--text3);">${cd.labelEn}</span>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="param-grid" id="params-${cd.key}"></div>
      </div>
    `;
    container.appendChild(acc);

    const grid = acc.querySelector(`#params-${cd.key}`);
    meta.forEach(pm => {
      const item = document.createElement('div');
      item.className = 'param-item';
      const valId = `pv-${cd.key}-${pm.key}`;
      item.innerHTML = `
        <div class="param-header">
          <span class="param-name">${pm.label}</span>
          <span class="param-val" id="${valId}">${params[pm.key]}</span>
        </div>
        <input type="range" min="${pm.min}" max="${pm.max}" step="${pm.step}"
               value="${params[pm.key]}"
               oninput="updateParam('${cd.key}','${pm.key}',+this.value,'${valId}')">
      `;
      grid.appendChild(item);
    });
  });
}

function toggleAcc(key) {
  const el = document.getElementById(`acc-${key}`);
  el.classList.toggle('open');
}

function updateParam(curve, param, val, labelId) {
  S.params[curve][param] = val;
  document.getElementById(labelId).textContent = val;

  // Sync strength panel if relevant
  const spMap = {
    'employ-str': ['sp-employ-val', 'sp-employ input'],
    'pulse-str':  ['sp-pulse-val',  'sp-pulse input'],
    'serial-str': ['sp-serial-val', 'sp-serial input'],
    'ai-depth':   ['sp-ai-val',     'sp-ai input'],
    'capital-rate':['sp-capital-val','sp-capital input'],
  };
  const mk = `${curve}-${param}`;
  if (spMap[mk]) {
    const [labelEl, sliderSel] = spMap[mk];
    const lbl = document.getElementById(labelEl);
    if (lbl) lbl.textContent = val;
    const sl = document.querySelector(`.strength-panel #sp-${curve} input`);
    if (sl) sl.value = val;
  }

  persist();
  refreshChartData();
  updateTodayPage();
}

/* ══ SNAPSHOTS ══════════════════════════════════════════════════════════════ */
function saveSnapshot() {
  const name = document.getElementById('snapshot-name-input').value.trim() || `快照 ${S.snapshots.length + 1}`;
  const snap = {
    id: Date.now(),
    name,
    date: new Date().toISOString(),
    params: JSON.parse(JSON.stringify(S.params)),
    enabled: { ...S.enabled },
    currentAge: S.currentAge,
    stage: S.stage,
  };
  S.snapshots.unshift(snap);
  if (S.snapshots.length > 10) S.snapshots.pop();
  persist();
  document.getElementById('snapshot-name-input').value = '';
  renderSnapshots();
  toast(`快照"${name}"已保存`, 'success');
}

function loadSnapshot(id) {
  const snap = S.snapshots.find(s => s.id === id);
  if (!snap) return;
  S.params = JSON.parse(JSON.stringify(snap.params));
  S.enabled = { ...snap.enabled };
  S.currentAge = snap.currentAge;
  S.stage = snap.stage;
  persist();
  syncAgeSliders();
  updateTodayPage();
  renderSettings();
  renderPills();
  refreshChartData();
  toast(`已恢复快照"${snap.name}"`, 'success');
}

function deleteSnapshot(id) {
  S.snapshots = S.snapshots.filter(s => s.id !== id);
  persist();
  renderSnapshots();
}

function renderSnapshots() {
  const list = document.getElementById('snapshot-list');
  if (!S.snapshots || S.snapshots.length === 0) {
    list.innerHTML = '<div class="empty" style="padding:16px 0;">暂无快照</div>';
    return;
  }
  list.innerHTML = '';
  S.snapshots.forEach(snap => {
    const d = new Date(snap.date);
    const dateStr = d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const item = document.createElement('div');
    item.className = 'snapshot-item';
    item.innerHTML = `
      <div class="snapshot-meta">
        <div class="snapshot-name">${escHtml(snap.name)}</div>
        <div class="snapshot-date">${dateStr} · age ${snap.currentAge}</div>
      </div>
      <button class="btn btn-secondary btn-xs" onclick="loadSnapshot(${snap.id})">恢复</button>
      <button class="btn btn-ghost btn-xs" style="color:#c64;" onclick="deleteSnapshot(${snap.id})">删</button>
    `;
    list.appendChild(item);
  });
}

/* ══ EXPORT / IMPORT ════════════════════════════════════════════════════════ */

function exportMarkdown() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  const STAGES = {
    edu: '📚 学习积累期', explore: '🔍 探索尝试期', growth: '📈 快速成长期',
    peak: '🚀 巅峰突破期', compound: '💰 复利收获期', stable: '🏔 稳定传承期'
  };

  // Compute current curve values
  const curveData = calcAllCurves();
  const ci = Math.max(0, Math.min(S.currentAge - MIN_AGE, AGES.length - 1));
  const curveNames = { employ: '传统就业', pulse: '创业脉冲', serial: '连续创业', ai: 'AI 协作', capital: '资本复利', composite: '复合叠加' };
  const curveVals = {};
  for (const k of Object.keys(curveNames)) {
    curveVals[k] = Math.round((curveData[k] || [])[ci] || 0);
  }

  // Check bull
  const bullResult = checkBullMarket();
  const bull = bullResult.bull;

  const lines = [];

  // Header
  lines.push(`# 人生曲线 · 记录报告`);
  lines.push(`\n> 导出时间：${dateStr}  ·  年龄：${S.currentAge} 岁  ·  阶段：${STAGES[S.stage] || S.stage}\n`);
  lines.push(`---\n`);

  // Status
  lines.push(`## 当前状态\n`);
  lines.push(`| 指标 | 数值 |`);
  lines.push(`|------|------|`);
  lines.push(`| 当前年龄 | ${S.currentAge} 岁 |`);
  lines.push(`| 人生阶段 | ${STAGES[S.stage] || S.stage} |`);
  lines.push(`| 永久牛市 | ${bull ? '✅ 达成（每个低点高于上一个）' : '⚠️ 未达标（需调整策略）'} |`);
  lines.push(`| 复合叠加指数 | ${curveVals.composite} / 100 |`);
  lines.push(``);

  // Curve values
  lines.push(`## 各维度生命力指数（满分 100）\n`);
  lines.push(`| 维度 | 当前值 | 状态 |`);
  lines.push(`|------|--------|------|`);
  const getBar = v => '█'.repeat(Math.round(v/10)) + '░'.repeat(10 - Math.round(v/10));
  for (const [k, name] of Object.entries(curveNames)) {
    if (k === 'composite') continue;
    const v = curveVals[k];
    const status = v >= 70 ? '强' : v >= 40 ? '中' : v >= 10 ? '弱' : '未启动';
    lines.push(`| ${name} | ${v} | ${getBar(v)} ${status} |`);
  }
  lines.push(``);

  // Params summary
  lines.push(`## 参数设置摘要\n`);
  const p = S.params;
  lines.push(`**传统就业**：${p.employ.startAge}岁开始 → ${p.employ.peakAge}岁巅峰 → ${p.employ.retireAge}岁退休 · 强度 ${p.employ.str}%`);
  lines.push(`\n**创业脉冲**：${p.pulse.startAge}岁起步 · ${p.pulse.cnt}次尝试 · 成功率 ${p.pulse.rate}% · 强度 ${p.pulse.str}%`);
  lines.push(`\n**连续创业**：${p.serial.startAge}岁启动 · ${p.serial.cyc}个周期 · 每期${p.serial.len}年 · 峰值强度 ${p.serial.str}%`);
  lines.push(`\n**AI 协作**：${p.ai.startAge}岁采用 · 跃迁量 ${p.ai.jump}% · 协作深度 ${p.ai.depth}% · 年增长 ${p.ai.grow}%`);
  lines.push(`\n**资本复利**：${p.capital.startAge}岁开始 · 初始资本 ${p.capital.init}% · 年化 ${p.capital.rate}% · 年追加 ${p.capital.add}%`);
  lines.push(``);

  // Milestones
  lines.push(`---\n`);
  lines.push(`## 人生里程碑\n`);
  if (S.milestones && S.milestones.length > 0) {
    const sorted = [...S.milestones].sort((a, b) => a.age - b.age);
    for (const m of sorted) {
      const status = m.done ? '✅' : (m.age <= S.currentAge ? '⏳' : '◯');
      lines.push(`- ${status} **${m.age} 岁** ${m.text}${m.note ? `\n  > ${m.note}` : ''}`);
    }
  } else {
    lines.push(`_暂无里程碑_`);
  }
  lines.push(``);

  // Journal
  lines.push(`---\n`);
  lines.push(`## 日志记录（共 ${(S.journal || []).length} 条）\n`);
  if (S.journal && S.journal.length > 0) {
    const sorted = [...S.journal].sort((a, b) => new Date(b.date) - new Date(a.date));
    for (const entry of sorted) {
      const d = new Date(entry.date);
      const ds = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
      lines.push(`### ${ds}（${entry.age} 岁）\n`);
      lines.push(`${entry.text}\n`);
    }
  } else {
    lines.push(`_暂无日志_`);
  }

  // Snapshots
  if (S.snapshots && S.snapshots.length > 0) {
    lines.push(`---\n`);
    lines.push(`## 历史快照（共 ${S.snapshots.length} 条）\n`);
    lines.push(`| 快照名称 | 保存时间 | 年龄 |`);
    lines.push(`|----------|----------|------|`);
    for (const snap of S.snapshots) {
      const d = new Date(snap.date).toLocaleDateString('zh-CN');
      lines.push(`| ${snap.name} | ${d} | ${snap.currentAge} 岁 |`);
    }
    lines.push(``);
  }

  // Footer
  lines.push(`---\n`);
  lines.push(`_由「人生曲线」工具生成 · https://yihan498.github.io/life-curve/_`);

  const md = lines.join('\n');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `人生曲线报告_${now.toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Markdown 报告已导出', 'success');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life_picture_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 JSON 文件', 'success');
}

function importJSON() {
  document.getElementById('import-file').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      S = deepMerge(DEFAULTS(), parsed);
      persist();
      syncAgeSliders();
      updateTodayPage();
      renderPills();
      refreshChartData();
      if (currentPage === 'settings') renderSettings();
      if (currentPage === 'log') renderLog();
      toast('数据导入成功', 'success');
    } catch(err) {
      toast('导入失败：文件格式错误', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetAll() {
  if (!confirm('确定要重置所有数据为默认值吗？')) return;
  S = DEFAULTS();
  persist();
  syncAgeSliders();
  updateTodayPage();
  renderPills();
  refreshChartData();
  if (currentPage === 'settings') renderSettings();
  if (currentPage === 'log') renderLog();
  toast('已重置为默认设置', 'success');
}

/* ══ TOAST ══════════════════════════════════════════════════════════════════ */
function toast(msg, type = '') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toast-out 0.25s ease forwards';
    setTimeout(() => el.remove(), 280);
  }, 2400);
}

/* ══ UTIL ═══════════════════════════════════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ══ INIT ═══════════════════════════════════════════════════════════════════ */
function init() {
  loadSaved();
  syncAgeSliders();
  document.getElementById('stage-select').value = S.stage;
  document.getElementById('today-note').value = S.todayNote;

  document.querySelector('#page-curves .strength-panel #sp-employ input').value = S.params.employ.str;
  document.getElementById('sp-employ-val').textContent = S.params.employ.str;
  document.querySelector('#page-curves .strength-panel #sp-pulse input').value = S.params.pulse.str;
  document.getElementById('sp-pulse-val').textContent = S.params.pulse.str;
  document.querySelector('#page-curves .strength-panel #sp-serial input').value = S.params.serial.str;
  document.getElementById('sp-serial-val').textContent = S.params.serial.str;
  document.querySelector('#page-curves .strength-panel #sp-ai input').value = S.params.ai.depth;
  document.getElementById('sp-ai-val').textContent = S.params.ai.depth;
  document.querySelector('#page-curves .strength-panel #sp-capital input').value = S.params.capital.rate;
  document.getElementById('sp-capital-val').textContent = S.params.capital.rate;

  renderPills();
  updateTodayPage();

  // Show today page
  goPage('today');
}

init();
